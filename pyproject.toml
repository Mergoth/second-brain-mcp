[project]
name = "second-brain-mcp"
version = "0.1.0"
description = "MCP server exposing an Obsidian vault over a confined local filesystem root"
requires-python = ">=3.11"
dependencies = ["mcp"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
